name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build app
        run: |
          chmod +x build.sh
          ./build.sh ${{ steps.version.outputs.version }}

      # `ditto` (not `zip -r`) preserves the framework symlinks and resource
      # forks; a plain zip would follow the symlinks and break the code
      # signature, which Sparkle then rejects.
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ProxyManager.app ProxyManager-${{ steps.version.outputs.version }}.zip

      # Sign the update archive with the EdDSA private key and emit appcast.xml.
      # The feed URL embedded in the app (SUFeedURL) is:
      #   https://github.com/<repo>/releases/latest/download/appcast.xml
      # so the appcast must be attached to every release.
      - name: Generate appcast
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY secret is not set — skipping appcast. This release will not be offered as an update."
            echo "has_appcast=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p updates
          cp "ProxyManager-${{ steps.version.outputs.version }}.zip" updates/

          KEY_FILE="$RUNNER_TEMP/sparkle_private_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          ./Vendor/Sparkle/bin/generate_appcast \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/" \
            -o updates/appcast.xml \
            updates/

          rm -f "$KEY_FILE"
          echo "has_appcast=true" >> "$GITHUB_OUTPUT"

      - name: Generate release body
        run: |
          chmod +x .github/scripts/changelog.sh
          .github/scripts/changelog.sh > CHANGELOG.md || true

          cat <<'EOF' > INSTALL.md
          ### Installation
          1. Download `ProxyManager-${{ steps.version.outputs.version }}.zip`
          2. Unzip and drag `ProxyManager.app` to your Applications folder
          3. Launch the app and click the menu bar icon

          ### Requirements
          - macOS 14.0 or later
          - An existing SOCKS5 proxy/tunnel (e.g. `ssh -D 1080 user@host`). On first launch, the onboarding guide asks for its address.

          > [!NOTE]
          > If you encounter security warnings, go to System Settings > Privacy & Security and click "Open Anyway".
          > The app is not notarized by Apple, so you may need to bypass Gatekeeper.
          >
          > Routing is prompt-free on a normal setup: the app sets the system proxy via `networksetup` as your user, and only falls back to an admin prompt if that genuinely fails.
          >
          > Once installed, Proxy Manager updates itself via Sparkle — use **Check for Updates…** in the menu bar.
          EOF

          if [ -s CHANGELOG.md ]; then
            cat CHANGELOG.md INSTALL.md > FULL_RELEASE.md
          else
            cat INSTALL.md > FULL_RELEASE.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body_path: FULL_RELEASE.md
          files: |
            ProxyManager-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach appcast
        if: steps.appcast.outputs.has_appcast == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" \
            updates/appcast.xml --clobber
